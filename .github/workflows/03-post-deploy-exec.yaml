# CI de Nível 03 - Disparo após a conclusão de outra pipeline

# nome da pipeline
name: 'N3 -Execução por Deploy'

# gatilhos / triggers - regras de disparo
# gatilho manual = workflow_dispatch
# gatilho agendado = schedule
# gatilho por conclusão de outra pipeline = workflow_run

on:
  workflow_run:
    workflows: ['N1 - Execução Manual', 'N2 - Execução Agendada']
    types:
      - completed

#tarefas dentro da pipeline = jobs

jobs:
  #nome do job
  unidade:
    # maquina onde o job vai rodar
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # passos do job
    steps:
      # clone do projeto
      - uses: actions/checkout@v4

      # instalção do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # instalação do Yarn
      - name: Instalando mocha
        run: npm install -g mocha

      #   instalação das dependências
      - name: Instalando dependências
        run: mocha

      # executar os testes de unidade
      - name: Executando testes de unidade
        run: npx mocha